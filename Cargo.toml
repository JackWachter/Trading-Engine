[package]
name = "trading-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "trading_engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slab = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
criterion = "=0.3.6"

[[bench]]
name = "engine_bench"
harness = false
